<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The portfolio of Zaira Christa, a web designer building thoughtful digital experiences.">
  <title>Zaira Christa — Web Designer</title>
  <link rel="preload" href="fonts/plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="home.css">
  <script>
    // The loader only runs the first time the site is opened in a tab; later visits to home skip it.
    try { if (!sessionStorage.getItem('zc-loaded')) document.documentElement.classList.add('loading'); } catch (e) { document.documentElement.classList.add('loading'); }
  </script>
  <noscript><style>.loading .z{opacity:1;transform:none}.loading .site-head,.loading .sub{opacity:1}.loading .counter{opacity:0}</style></noscript>
</head>
<body>
  <header class="site-head">
    <a href="index.html">zaira<br>christa</a>
    <nav aria-label="Main navigation"><a href="index.html">home</a><span aria-hidden="true">,</span><a href="about.html">about</a><span aria-hidden="true">,</span><a href="work.html">work</a><span aria-hidden="true">,</span><a href="cv.html">CV</a></nav>
  </header>

  <p class="hint" id="hint" aria-hidden="true">(keep going)</p>

  <main class="stage">
    <div class="lockup-wrap">
    <svg class="lockup" viewBox="540 345 920 560" role="img" aria-label="ZC">
      <defs>
        <mask id="gap" maskUnits="userSpaceOnUse" x="900" y="300" width="600" height="650">
          <rect x="900" y="300" width="600" height="650" fill="#fff"/>
          <rect x="1360" y="604" width="120" height="40" fill="#000"/>
        </mask>
      </defs>
      <g id="zfade"><polygon class="z" fill="#000" points="592,395 881,395 651,801 889,801 889,854 562,854 790,449 592,449"/></g>
      <text class="counter" id="counter" x="875" y="650" text-anchor="end" fill="#000">000%</text>
      <circle id="disc" cx="1197" cy="624.5" r="185" fill="#87ceeb" opacity="0"/>
      <g id="ring"><circle cx="1197" cy="624.5" r="211" fill="none" stroke="#000" stroke-width="56" mask="url(#gap)"/></g>
    </svg>
    <div id="subfade"><p class="sub">web designer + brand strategist</p></div>
    </div>
  </main>
  <div class="scroll-space" aria-hidden="true"></div>

  <script>
  (function () {
    var root = document.documentElement;
    var ring = document.getElementById('ring');
    var counter = document.getElementById('counter');
    var CX = 1197, CY = 624.5;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function setAngle(a) { ring.setAttribute('transform', 'rotate(' + a + ' ' + CX + ' ' + CY + ')'); }

    // Scrolling turns the C anti-clockwise and carries us through it: the C moves to the middle of the
    // window and grows, its centre fades to sky blue, and the blue ends up filling the whole window.
    var DEG_PER_PX = 0.12, FOLLOW = 0.08;
    var HINT_IDLE_MS = 900;              // how long scrolling must stop before "(keep going)" appears
    var RANGE_VH = 1.5;                  // scroll distance (in window heights) over which the zoom plays
    var VIEW_W = 920, C_INNER_R = 183, C_OFFSET_X = 1197 - 1000;  // lockup viewBox units
    function clamp01(x) { return Math.max(0, Math.min(1, x)); }
    function smooth(a, b, x) { var t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); }

    function initScroll() {
      if (reduce) return;
      var wrap = document.querySelector('.lockup-wrap');
      var disc = document.getElementById('disc');
      var zfade = document.getElementById('zfade');
      var subfade = document.getElementById('subfade');
      var hint = document.getElementById('hint');
      var lastMove = performance.now(), hintShown = false;
      var unit, maxScale;
      function measure() {
        unit = wrap.offsetWidth / VIEW_W;  // px per viewBox unit (offsetWidth ignores transforms)
        // big enough that the C's inner edge sits beyond the window corners
        maxScale = 1.1 * Math.hypot(window.innerWidth, window.innerHeight) / 2 / (C_INNER_R * unit);
      }
      measure();
      window.addEventListener('resize', measure);

      var current = 0;
      (function frame() {
        var y = window.scrollY;
        current += (y - current) * FOLLOW;
        if (Math.abs(y - current) < 0.1) current = y;
        var p = clamp01(current / (window.innerHeight * RANGE_VH));
        if (Math.abs(y - current) > 0.5) lastMove = performance.now();
        // paused partway through: nudge them on. It sits under the C, so the C covers it as it grows.
        // once shown it stays (no fade-out) until the black of the C covers it, or we're back at the top
        if (p <= .03 || p >= .9) hintShown = false;
        else if (!hintShown && performance.now() - lastMove > HINT_IDLE_MS) hintShown = true;
        hint.classList.toggle('show', hintShown);

        setAngle(-current * DEG_PER_PX);
        var scale = Math.exp(Math.log(maxScale) * Math.pow(p, 1.7));
        var tx = -C_OFFSET_X * unit * smooth(0, .55, p);
        wrap.style.transform = 'translate(' + tx + 'px,0) scale(' + scale + ')';
        disc.setAttribute('opacity', smooth(.08, .6, p));
        var textOpacity = 1 - smooth(0, .3, p);
        zfade.setAttribute('opacity', textOpacity);
        subfade.style.opacity = textOpacity;
        requestAnimationFrame(frame);
      })();
    }

    if (!root.classList.contains('loading')) { initScroll(); return; } // already seen this session: no loader
    var LOAD_MS = reduce ? 600 : 2800;   // time the counter takes to reach 100
    var V0 = 0.36;                       // spin speed in deg/ms, constant until 100 and the speed the slow-down starts from
    var MIN_EXTRA = 90;                  // least extra rotation after 100 before the gap lands facing right

    function setCount(n) { counter.textContent = String(n).padStart(3, '0') + '%'; }

    var start = null, angle = 0;
    var settleStart = null, settleFrom = 0, settleDist = 0, settleMs = 0, revealed = false;

    function reveal() {
      if (revealed) return;
      revealed = true;
      try { sessionStorage.setItem('zc-loaded', '1'); } catch (e) {}
      root.classList.remove('loading');
    }

    // Ease-out with a starting speed of exactly V0, so the ring only ever slows down after 100.
    // Distance D covers the quadratic ease-out: speed at t=0 is 2D/T, so T = 2D/V0.
    function settle(now) {
      if (settleStart === null) {
        settleStart = now;
        settleFrom = angle;
        // land on a multiple of 360 so the gap faces right, like the C in the logo
        settleDist = Math.ceil((angle + MIN_EXTRA) / 360) * 360 - angle;
        settleMs = 2 * settleDist / V0;
      }
      var t = Math.min(1, (now - settleStart) / settleMs);
      setAngle(settleFrom + settleDist * (1 - (1 - t) * (1 - t)));
      if (t > .7) reveal();
      if (t < 1) requestAnimationFrame(settle); else { setAngle(0); reveal(); initScroll(); }
    }

    function tick(now) {
      if (start === null) start = now;
      var elapsed = now - start;
      var p = Math.min(1, elapsed / LOAD_MS);
      // slightly uneven progress so it reads as real loading
      var eased = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      setCount(Math.round((0.6 * p + 0.4 * eased) * 100));
      angle = elapsed * V0;
      if (!reduce) setAngle(angle);
      if (p < 1) { requestAnimationFrame(tick); return; }
      setCount(100);
      if (reduce) { setAngle(0); reveal(); } else requestAnimationFrame(settle);
    }

    requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
